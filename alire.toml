name = "espidf_nvs_flash"
version = "0.1.0-dev"
website = "https://github.com/godunko/espidf_nvs_flash"
description = "Ada/ESP-IDF: NVS Flash bindings"
long-description = """
Ada bindings for the ESP-IDF Non-Volatile Storage (NVS) Flash driver, enabling persistent key-value data storage on Espressif microcontrollers.
"""

authors = ["Vadim Godunko"]
maintainers = ["Vadim Godunko <vgodunko@gmail.com>"]
maintainers-logins = ["godunko"]
licenses = "Apache-2.0 WITH LLVM-exception"
tags = ["a0b", "embedded", "esp", "esp32", "espidf"]

[configuration]
generate_ada = false
generate_c = false
generate_gpr = true

[[depends-on]]
espidf = "*"
